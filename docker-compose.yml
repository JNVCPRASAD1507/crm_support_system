services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: crm_support_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: prasad123
    ports: ["5432:5432"]
    volumes: [crm_pgdata:/var/lib/postgresql]
  backend:
    build: ./backend
    env_file: ./backend/.env
    ports: ["8000:8000"]
    depends_on: [db]
    volumes: [./backend/uploads:/app/uploads]
volumes:
  crm_pgdata:
